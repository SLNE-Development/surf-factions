<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="FRONTEN">
  <defs>
    <clipPath id="tile"><rect x="1" y="1" width="98" height="98" rx="23"/></clipPath>
  </defs>
  <!-- Kartentafel -->
  <rect x="1" y="1" width="98" height="98" rx="23" fill="#0b0e13"/>
  <g clip-path="url(#tile)">
    <!-- zwei Territorien -->
    <rect x="0" y="0" width="50" height="100" fill="#e0563f" opacity="0.07"/>
    <rect x="50" y="0" width="50" height="100" fill="#4faec4" opacity="0.07"/>
    <!-- Kartengitter -->
    <g stroke="#7d94b3" stroke-width="1" opacity="0.10">
      <line x1="25" y1="0" x2="25" y2="100"/>
      <line x1="75" y1="0" x2="75" y2="100"/>
      <line x1="0" y1="25" x2="100" y2="25"/>
      <line x1="0" y1="75" x2="100" y2="75"/>
    </g>
    <!-- Frontlinie -->
    <path d="M50 8 L50 30 L34 40 L50 50 L66 60 L50 70 L50 92"
      fill="none" stroke="#e0563f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Kontrollpunkt -->
    <circle cx="50" cy="50" r="10" fill="#0b0e13" stroke="#4faec4" stroke-width="3.5"/>
    <circle cx="50" cy="50" r="3.8" fill="#4faec4"/>
  </g>
  <rect x="1" y="1" width="98" height="98" rx="23" fill="none" stroke="#39465a" stroke-width="2"/>
</svg>
