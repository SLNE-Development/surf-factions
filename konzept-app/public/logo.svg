<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 721 220" width="721" height="220" role="img" aria-label="FRONTEN — CastCrafter Factions">
  <defs>
    <clipPath id="panel"><rect x="1" y="1" width="719" height="218" rx="20"/></clipPath>
    <clipPath id="ltile"><rect x="52" y="50" width="120" height="120" rx="28"/></clipPath>
  </defs>

  <!-- Panel -->
  <rect x="1" y="1" width="719" height="218" rx="20" fill="#0b0e13"/>
  <g clip-path="url(#panel)">
    <rect x="0" y="0" width="721" height="220" fill="url(#g)"/>
    <g stroke="#7d94b3" stroke-width="1" opacity="0.06">
      <line x1="0" y1="55" x2="721" y2="55"/><line x1="0" y1="110" x2="721" y2="110"/><line x1="0" y1="165" x2="721" y2="165"/>
      <line x1="230" y1="0" x2="230" y2="220"/><line x1="410" y1="0" x2="410" y2="220"/><line x1="590" y1="0" x2="590" y2="220"/>
    </g>
  </g>
  <radialGradient id="g" cx="20%" cy="0%" r="90%">
    <stop offset="0%" stop-color="#e0563f" stop-opacity="0.08"/>
    <stop offset="60%" stop-color="#4faec4" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#0b0e13" stop-opacity="0"/>
  </radialGradient>

  <!-- Mark -->
  <rect x="52" y="50" width="120" height="120" rx="28" fill="#0e121a"/>
  <g clip-path="url(#ltile)">
    <g transform="translate(52,50) scale(1.2)">
      <rect x="0" y="0" width="50" height="100" fill="#e0563f" opacity="0.07"/>
      <rect x="50" y="0" width="50" height="100" fill="#4faec4" opacity="0.07"/>
      <g stroke="#7d94b3" stroke-width="1" opacity="0.10">
        <line x1="25" y1="0" x2="25" y2="100"/><line x1="75" y1="0" x2="75" y2="100"/>
        <line x1="0" y1="25" x2="100" y2="25"/><line x1="0" y1="75" x2="100" y2="75"/>
      </g>
      <path d="M50 8 L50 30 L34 40 L50 50 L66 60 L50 70 L50 92"
        fill="none" stroke="#e0563f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="50" cy="50" r="10" fill="#0e121a" stroke="#4faec4" stroke-width="3.5"/>
      <circle cx="50" cy="50" r="3.8" fill="#4faec4"/>
    </g>
  </g>
  <rect x="52" y="50" width="120" height="120" rx="28" fill="none" stroke="#39465a" stroke-width="2"/>

  <!-- Wortmarke -->
  <text x="212" y="128" font-family="Bahnschrift, 'DIN Condensed', 'Oswald', 'Arial Narrow', sans-serif"
        font-size="82" font-weight="700" letter-spacing="14">
    <tspan fill="#e9e5d9">FRON</tspan><tspan fill="#e0563f">TEN</tspan>
  </text>
  <!-- Frontlinien-Akzent -->
  <path d="M211 150 L300 150 L316 142 L332 158 L352 146 L392 152 L655 152"
    fill="none" stroke="#e0563f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <text x="214" y="182" font-family="Consolas, 'Cascadia Code', monospace"
        font-size="15.5" letter-spacing="5" fill="#6a7178">CASTCRAFTER FACTIONS</text>
</svg>
