<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRONTEN — CastCrafter Factions · Konzept-Explorer</title>
<style>
/* ============================================================
   FRONTEN — Konzept-Explorer
   Feldhandbuch / Lagekarte. Dark war-room.
   ============================================================ */

:root{
  --bg:#0b0e13;
  --bg-2:#0e121a;
  --panel:#141a24;
  --panel-2:#1a2130;
  --panel-3:#212a3a;
  --line:#242d3b;
  --line-strong:#39465a;

  --ink:#e9e5d9;        /* pergament */
  --ink-dim:#9aa0a2;
  --ink-faint:#6a7178;

  --war:#e0563f;        /* krieg / belagerung / pvp */
  --war-deep:#7c2c20;
  --peace:#4faec4;      /* diplomatie / frieden / handel */
  --peace-deep:#245b68;
  --gold:#c9a24a;       /* chronik / prestige / season */
  --gold-deep:#6f5824;
  --moss:#9aac5e;       /* wiederspielwert / erspielt */
  --ausbau:#9a86c4;     /* MEINE ergaenzungen, klar markiert */

  --font-display:"Bahnschrift","DIN Alternate","Oswald","Segoe UI Semibold",system-ui,sans-serif;
  --font-body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"Cascadia Code","Consolas",ui-monospace,"SFMono-Regular",monospace;

  --sidebar-w:288px;
  --maxread:760px;
  --radius:4px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;
  background:
    linear-gradient(180deg,rgba(224,86,63,.03),transparent 40%),
    radial-gradient(1200px 600px at 80% -10%,rgba(79,174,196,.05),transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
/* kartengitter */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(120,140,170,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,140,170,.045) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(120% 100% at 50% 0%,#000 55%,transparent 100%);
}
a{color:inherit;text-decoration:none}
::selection{background:rgba(224,86,63,.32);color:#fff}

/* scrollbar */
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#2a3242;border-radius:6px;border:2px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:#3a475a}

/* ---------- LAYOUT ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}

/* ---------- SIDEBAR ---------- */
.sidebar{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid var(--line);
  background:linear-gradient(180deg,var(--bg-2),rgba(11,14,19,.6));
  padding:0 0 40px;
  backdrop-filter:blur(4px);
}
.brand{
  padding:22px 22px 18px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg-2);z-index:2;
}
.brand a{display:block}
.brand__mark{
  font-family:var(--font-display);font-weight:700;letter-spacing:.42em;
  font-size:26px;line-height:1;color:var(--ink);text-indent:.42em;
}
.brand__sub{
  margin-top:9px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);
}
.brand__tag{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;
  color:var(--war);text-transform:uppercase;
}
.brand__tag::before{content:"";width:6px;height:6px;background:var(--war);border-radius:50%;box-shadow:0 0 8px var(--war);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.nav{padding:16px 12px 0}
.nav__group{margin-bottom:20px}
.nav__label{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);padding:0 12px 8px;display:flex;align-items:center;gap:8px;
}
.nav__label::after{content:"";flex:1;height:1px;background:var(--line)}
.nav__item{
  display:flex;align-items:baseline;gap:9px;padding:6px 12px;border-radius:var(--radius);
  color:var(--ink-dim);font-size:13.5px;cursor:pointer;position:relative;
  transition:background .12s,color .12s;
}
.nav__item:hover{background:var(--panel);color:var(--ink)}
.nav__item.is-active{background:var(--panel-2);color:var(--ink)}
.nav__item.is-active::before{
  content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--war);
}
.nav__num{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);min-width:20px}
.nav__item.is-active .nav__num{color:var(--war)}

/* ---------- MAIN ---------- */
.main{min-width:0;padding:0}
.view{padding:56px clamp(24px,5vw,72px) 120px;max-width:1180px;margin:0 auto;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.crumb{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.crumb a:hover{color:var(--peace)}
.crumb__sep{color:var(--line-strong)}

/* eyebrow + titles */
.eyebrow{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--war);margin-bottom:14px;display:flex;gap:10px;align-items:center;
}
h1.title{
  font-family:var(--font-display);font-weight:700;letter-spacing:.02em;line-height:1.02;
  font-size:clamp(30px,5vw,54px);margin:0 0 6px;color:#fff;overflow-wrap:break-word;
}
.lede,.prose p,.prose li,.card__title,.link__why,.q__t,.pillar__d{overflow-wrap:break-word}
.title--sm{font-size:clamp(28px,4vw,40px)}
.lede{font-size:19px;line-height:1.6;color:var(--ink-dim);max-width:var(--maxread);margin:14px 0 0}

h2.sec{
  font-family:var(--font-display);font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  font-size:15px;color:var(--ink);margin:44px 0 16px;display:flex;align-items:center;gap:12px;
}
h2.sec::before{
  content:attr(data-k);font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;
  color:var(--bg);background:var(--gold);padding:3px 7px;border-radius:3px;font-weight:700;text-transform:none;
}
h2.sec[data-tone="war"]::before{background:var(--war)}
h2.sec[data-tone="peace"]::before{background:var(--peace)}

.prose{max-width:var(--maxread)}
.prose p{margin:0 0 15px}
.prose strong{color:var(--ink);font-weight:600}
.prose em{color:var(--gold);font-style:normal}
.prose ul{margin:0 0 15px;padding:0;list-style:none}
.prose li{position:relative;padding-left:22px;margin:0 0 9px}
.prose li::before{content:"";position:absolute;left:4px;top:11px;width:6px;height:6px;background:var(--war);transform:rotate(45deg)}
.prose .k{font-family:var(--font-mono);font-size:.86em;background:var(--panel-2);border:1px solid var(--line);padding:1px 6px;border-radius:3px;color:var(--peace)}

/* ausbau callout — meine ergaenzungen */
.ausbau{
  border-left:2px solid var(--ausbau);background:linear-gradient(90deg,rgba(154,134,196,.08),transparent);
  padding:12px 16px;margin:0 0 15px;border-radius:0 var(--radius) var(--radius) 0;max-width:var(--maxread);
}
.ausbau__tag{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ausbau);display:inline-flex;align-items:center;gap:6px;margin-bottom:5px;
}
.ausbau__tag::before{content:"◆";font-size:8px}
.ausbau p{margin:0;color:var(--ink-dim);font-size:14.5px}
.ausbau p+p{margin-top:8px}

/* meta chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
.chip{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--line-strong);color:var(--ink-dim);
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);
}
.chip[data-c="LZ"]{color:var(--gold);border-color:var(--gold-deep)}
.chip[data-c="PVP"]{color:var(--war);border-color:var(--war-deep)}
.chip[data-c="TP"]{color:var(--peace);border-color:var(--peace-deep)}
.chip[data-c="WW"]{color:var(--moss);border-color:#4f5a34}
.chip[data-c="EM"]{color:var(--ausbau);border-color:#4a3f66}
.chip--status{color:var(--ink);border-color:var(--line-strong)}
.chip--kern{color:var(--ink-dim)}
.chip--kern::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-faint)}
.chip--ausbau{color:var(--ausbau);border-color:#4a3f66}
.chip--ausbau::before{content:"◆";font-size:8px}

/* connection block */
.links{margin:8px 0 0;max-width:var(--maxread)}
.link{
  display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;
  padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);margin-bottom:8px;cursor:pointer;transition:border-color .14s,background .14s,transform .14s;
}
.link:hover{border-color:var(--line-strong);background:var(--panel-2);transform:translateX(2px)}
.link__to{font-family:var(--font-display);font-weight:600;letter-spacing:.02em;color:var(--ink);font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.link__to .arrow{color:var(--war);font-size:12px}
.link__why{color:var(--ink-dim);font-size:14px}
.link__why b{color:var(--peace);font-weight:600}

/* cards grid (home + catalog) */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));margin-top:8px}
.card{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
  padding:18px 18px 16px;cursor:pointer;position:relative;overflow:hidden;
  transition:border-color .14s,transform .14s,background .14s;
}
.card:hover{border-color:var(--line-strong);transform:translateY(-2px);background:var(--panel-2)}
.card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--war));opacity:.7}
.card__nr{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.card__title{font-family:var(--font-display);font-weight:600;letter-spacing:.02em;font-size:18px;color:var(--ink);margin:6px 0 8px;line-height:1.15}
.card__desc{font-size:13.5px;color:var(--ink-dim);line-height:1.5}
.card__foot{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.card__foot .chip{font-size:9.5px;padding:2px 7px}

/* filter bar */
.filter{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 8px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.filter__search{
  flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink);font-family:var(--font-body);font-size:14px;padding:9px 13px;
}
.filter__search::placeholder{color:var(--ink-faint)}
.filter__search:focus{outline:none;border-color:var(--peace)}
.toggle{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  padding:6px 11px;border-radius:3px;border:1px solid var(--line-strong);color:var(--ink-dim);
  background:var(--panel);cursor:pointer;transition:all .12s;
}
.toggle:hover{color:var(--ink)}
.toggle.is-on{color:var(--bg);font-weight:700}
.toggle.is-on[data-c="LZ"]{background:var(--gold);border-color:var(--gold)}
.toggle.is-on[data-c="PVP"]{background:var(--war);border-color:var(--war)}
.toggle.is-on[data-c="TP"]{background:var(--peace);border-color:var(--peace)}
.toggle.is-on[data-c="WW"]{background:var(--moss);border-color:var(--moss)}
.toggle.is-on[data-c="EM"]{background:var(--ausbau);border-color:var(--ausbau)}
.filter__count{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-left:auto}

/* ---------- HOME HERO ---------- */
.hero{position:relative;padding:30px 0 20px;margin-bottom:20px}
.hero__eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--peace);margin-bottom:22px}
.hero__mark{
  font-family:var(--font-display);font-weight:700;font-size:clamp(64px,14vw,150px);line-height:.86;
  letter-spacing:.06em;color:#fff;margin:0;position:relative;
}
.hero__mark span{color:var(--war)}
.hero__frontline{width:100%;height:34px;margin:6px 0 26px;display:block}
.hero__thesis{
  font-family:var(--font-display);font-weight:500;font-size:clamp(20px,3vw,30px);line-height:1.25;
  color:var(--ink);max-width:820px;letter-spacing:.01em;
}
.hero__thesis b{color:var(--war);font-weight:700}
.hero__meta{display:flex;flex-wrap:wrap;gap:26px;margin-top:34px;padding-top:26px;border-top:1px solid var(--line)}
.hstat{}
.hstat__n{font-family:var(--font-display);font-weight:700;font-size:32px;color:var(--ink);line-height:1}
.hstat__l{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px}

/* pillars */
.pillar{
  display:grid;grid-template-columns:56px 1fr;gap:18px;padding:20px 0;border-top:1px solid var(--line);
  align-items:start;
}
.pillar:last-child{border-bottom:1px solid var(--line)}
.pillar__nr{font-family:var(--font-display);font-weight:700;font-size:34px;color:var(--war);line-height:1;letter-spacing:.02em}
.pillar__t{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:.02em;color:var(--ink);margin:0 0 4px}
.pillar__d{color:var(--ink-dim);font-size:15px;max-width:640px}

/* section heading big */
.blockhead{margin:64px 0 8px}
.blockhead__k{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint)}
.blockhead__t{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,3.4vw,36px);letter-spacing:.02em;color:#fff;margin:8px 0 6px}
.blockhead__d{color:var(--ink-dim);max-width:var(--maxread)}

/* ---------- GRAPH ---------- */
.graphwrap{border:1px solid var(--line);border-radius:var(--radius);background:radial-gradient(900px 500px at 50% 40%,rgba(79,174,196,.05),transparent),var(--bg-2);position:relative;overflow:hidden;height:min(72vh,720px)}
.graphwrap svg{width:100%;height:100%;display:block;cursor:grab}
.graphwrap svg:active{cursor:grabbing}
.g-edge{stroke:#2b3546;stroke-width:1.2;transition:stroke .15s,stroke-width .15s}
.g-edge.hot{stroke:var(--war);stroke-width:1.8;opacity:.9}
.g-node{cursor:pointer}
.g-node circle{transition:r .15s,fill .15s,stroke .15s}
.g-node text{font-family:var(--font-mono);font-size:10px;fill:var(--ink-dim);pointer-events:none;letter-spacing:.02em}
.g-node:hover text,.g-node.hot text{fill:#fff}
.graph-legend{position:absolute;left:14px;bottom:14px;display:flex;gap:16px;flex-wrap:wrap;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-dim);background:rgba(11,14,19,.7);padding:9px 13px;border:1px solid var(--line);border-radius:var(--radius)}
.graph-legend span{display:inline-flex;align-items:center;gap:6px}
.graph-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.graph-hint{position:absolute;right:14px;top:14px;font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.1em}

/* ---------- TABLE (war states / roadmap) ---------- */
.tbl{width:100%;border-collapse:collapse;margin:8px 0 20px;font-size:14px;max-width:var(--maxread)}
.tbl th,.tbl td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:400}
.tbl td b{color:var(--ink)}
.tbl tr:hover td{background:var(--panel)}

/* question cards */
.q{border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:0 var(--radius) var(--radius) 0;background:var(--panel);padding:20px 22px;margin-bottom:16px;max-width:var(--maxread)}
.q__k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;gap:10px;align-items:center}
.q__k .block{color:var(--war)}
.q__t{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--ink);margin:0 0 10px;letter-spacing:.01em}
.q__body{color:var(--ink-dim);font-size:14.5px}
.q__body p{margin:0 0 10px}
.q__rec{margin-top:12px;padding:12px 15px;background:rgba(154,134,196,.08);border-radius:var(--radius)}
.q__rec .l{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ausbau);display:block;margin-bottom:5px}
.q__rec p{margin:0;color:var(--ink)}

/* misc */
.pagenav{display:flex;justify-content:space-between;gap:14px;margin-top:56px;padding-top:24px;border-top:1px solid var(--line)}
.pagenav a{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);display:flex;flex-direction:column;gap:3px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);max-width:48%;transition:all .14s}
.pagenav a:hover{border-color:var(--line-strong);color:var(--ink)}
.pagenav .dir{color:var(--ink-faint);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.pagenav .r{text-align:right;align-items:flex-end}

.callout{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:16px 18px;margin:0 0 15px;max-width:var(--maxread)}
.callout--war{border-left:2px solid var(--war)}
.callout--peace{border-left:2px solid var(--peace)}
.callout--gold{border-left:2px solid var(--gold)}
.callout__l{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
.callout p{margin:0;font-size:14.5px;color:var(--ink-dim)}
.callout p strong{color:var(--ink)}

.mobiletop{display:none}
.scrim{display:none;border:none}

/* ---------- RESPONSIVE ---------- */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(84vw,320px);transform:translateX(-100%);transition:transform .24s;z-index:50;box-shadow:0 0 40px rgba(0,0,0,.6)}
  .sidebar.is-open{transform:none}
  .mobiletop{display:flex;position:sticky;top:0;z-index:40;align-items:center;gap:14px;padding:12px 18px;background:var(--bg-2);border-bottom:1px solid var(--line)}
  .mobiletop__b{font-family:var(--font-mono);font-size:22px;color:var(--ink);background:none;border:none;cursor:pointer;line-height:1}
  .mobiletop__t{font-family:var(--font-display);font-weight:700;letter-spacing:.3em;font-size:16px;text-indent:.3em}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45;opacity:0;pointer-events:none;transition:opacity .24s}
  .scrim.is-on{opacity:1;pointer-events:auto}
  .view{padding:34px 22px 90px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app">
  <button class="scrim" id="scrim" aria-label="Menü schließen"></button>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <a href="#/">
        <div class="brand__mark">FRONTEN</div>
        <div class="brand__sub">CastCrafter Factions · Konzept</div>
      </a>
      <div class="brand__tag">Diskussionsgrundlage v0.4</div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="mobiletop">
      <button class="mobiletop__b" id="burger" aria-label="Menü">☰</button>
      <div class="mobiletop__t">FRONTEN</div>
    </div>
    <div id="view" class="viewhost"></div>
  </main>
</div>

<script>
/* ============================================================
   DATEN
   ============================================================ */
window.META = {
  title:"FRONTEN",
  sub:"CastCrafter Factions",
  stand:"15. Juli 2026 · Version 0.4",
};

/* Fokus-Tags */
window.TAGS = {
  LZ:"Langzeitmotivation", PVP:"PvP", TP:"Teamplay", WW:"Wiederspielwert", EM:"Einzigartige Mechanik"
};

window.PILLARS = [

  status:"Kapitel 4", origin:"kern", tags:["LZ","WW"],
  lede:"Vier getrennte Rang-Achsen, Aufgaben, die niemals „töte 10 Spieler“ sagen, und ein BattlePass, der kostenlos ist — vollständig, für alle. Denn sobald es einen Premium-Track gibt, hat man den ersten Riss in der P2W-freien Wand.",

    "<b>Aufgaben:</b> Dailies (3 aus Pool, ~30–45 min: „sei bei einer Belagerung anwesend“, „liefere 1 Fracht“, „handle mit einer anderen Fraktion“ …), Weeklies (5), Monthly/Season-Kapitel (2–3, Prestige). <em>Nie</em> „töte X Spieler“ — das produziert Spawnkilling. Dailies rollen über (max. 3 Tage Stau), damit Abwesenheit nicht bestraft wird.",
    "<b>BattlePass:</b> kostenlos, 50 Stufen über ein Season-Kapitel (~8 Wochen), Fortschritt nur über Aufgaben und Chronik. Inhalt zu 100 % kosmetisch (Titel, Partikel, Banner-Muster, Marken) — null Ressourcen, Gear, Mandat oder Coins. Stufen-Cap pro Woche (z. B. 8), damit Vielspieler nicht in Woche 1 durch sind.",

{id:"idee-14", nr:14, cat:"Wirtschaft und Logistik", title:"Die Werkstatt", origin:"kern", tags:["TP","LZ","EM"],
 was:["Fortgeschrittene Gegenstände (Belagerungsgerät, verstärkte Materialien) werden nicht am Crafting-Table hergestellt, sondern in einer Fraktionswerkstatt — einem Multi-Block-Bauwerk, das mehrere Spieler gleichzeitig bedienen müssen."],
 wie:["Einer legt ein, einer kurbelt, einer entnimmt; es braucht Zeit. Produktion wird zum Gruppenerlebnis statt zu einem Klick — und ist gleichzeitig ein natürliches Angriffsziel."],
 links:[{to:"items",why:"Fertigt verstärkte Materialien und Belagerungsgerät."},{to:"ressourcen",why:"Verarbeitet Blutstein und Sternenerz."},{to:"idee-31",why:"Braucht besetzte Rollen — passt zur Rollenpflicht."}]},
{id:"idee-15", nr:15, cat:"Wirtschaft und Logistik", title:"Spezialisierung", origin:"kern", tags:["EM","TP","LZ"],
 was:["Eine Fraktion wählt pro Kapitel eine von sechs Spezialisierungen (Bergbau, Handel, Krieg, Logistik, Handwerk, Aufklärung). Jede gibt Boni in ihrem Feld und Mali in einem anderen."],
 wie:["Keine Fraktion kann alles. Zwei Fraktionen mit komplementären Spezialisierungen sind natürliche Verbündete — Diplomatie entsteht aus Mechanik statt aus gutem Willen."],
 links:[{to:"ressourcen",why:"Verstärkt die regionale Arbeitsteilung auf Fraktionsebene."},{to:"diplomatie",why:"Komplementäre Spezialisierungen erzeugen natürliche Allianzen."},{to:"claims",why:"Kann Claim- und Produktionsboni beeinflussen."}]},
{id:"idee-16", nr:16, cat:"Wirtschaft und Logistik", title:"Der Schwarzmarkt", origin:"kern", tags:["EM","LZ"],
 was:["Ein rotierender, geheimer Ort in der Wildnis, dessen Position nur über Kartenfragmente auffindbar ist. Dort werden Reliquien, Kartenfragmente und Werkstattpläne gehandelt — ohne Fraktionszugehörigkeitsprüfung, PvP an."],
 wie:["Wer hingeht, weiß, dass Feinde dort auch hingehen. Trotzdem gehen alle hin."],
 links:[{to:"items",why:"Umschlagplatz für Reliquien, Fragmente und Werkstattpläne."},{to:"pvp",why:"PvP-Zone, die alle Fraktionen anzieht."},{to:"ressourcen",why:"Kartenfragmente erzwingen den Weg zum Markt."}]},
{id:"idee-17", nr:17, cat:"Wirtschaft und Logistik", title:"Kredite und Schulden", origin:"kern", tags:["EM","LZ"],
 was:["Fraktionen können anderen Kredite gewähren: Betrag, Laufzeit, Zins — alles im Vertragssystem."],
 wie:["Zahlt der Schuldner nicht, geht die Forderung automatisch in einen öffentlichen Chronik-Eintrag, und der Gläubiger bekommt einen kostenlosen Belagerungsanspruch. Schulden werden zum legitimen Kriegsgrund — Geopolitik in einem Feature."],
 links:[{to:"diplomatie",why:"Kredite sind ein Vertragstyp mit Konsequenz."},{to:"oekonomie",why:"Bewegt CastCoins zwischen Fraktionskassen."},{to:"belagerung",why:"Zahlungsausfall erzeugt einen legitimen Belagerungsanspruch."}]},
{id:"idee-18", nr:18, cat:"Wirtschaft und Logistik", title:"Der Tribut-Automat", origin:"kern", tags:["TP"],
 was:["Ein Vertragstyp, der automatisch periodisch Ressourcen überweist."],
 wie:["Klingt banal, ist aber der Unterschied zwischen „Vasall sein“ als Rollenspiel und „Vasall sein“ als Systemzustand. Ein starker Clan kann drei schwächere zu Tributpflichtigen machen, statt sie zu zerstören — und hat damit einen Grund, sie zu beschützen."],
 links:[{to:"diplomatie",why:"Macht Vasallentum zu einem echten, automatisierten Vertragszustand."},{to:"oekonomie",why:"Periodische Ressourcen-/Coin-Überweisung."},{to:"antipatterns",why:"Alternative zur ausgeschlossenen permanenten Vernichtung."}]},
{id:"idee-19", nr:19, cat:"Wirtschaft und Logistik", title:"Ressourcen-Erschöpfung", origin:"kern", tags:["EM","WW"],
 was:["Eine Blutstein-Ader in einem Chunk ist endlich und respawnt über Tage. Ein lange ausgebeutetes Territorium wird wertlos."],
 wie:["Das zwingt zu Expansion und macht die Karte über die Season dynamisch: Die begehrten Regionen von Woche 2 sind in Woche 10 leer. Ohne diesen Mechanismus zementiert sich die Geografie am Tag 3."],
 links:[{to:"ressourcen",why:"Macht die Ressourcenverteilung über die Season dynamisch."},{to:"claims",why:"Entwertet statische Territorien und erzwingt Bewegung."},{to:"season",why:"Treibt den Wandel der Machtgeografie über die Kapitel."}]},
{id:"idee-20", nr:20, cat:"Wirtschaft und Logistik", title:"Der Frachtbrief", origin:"kern", tags:["EM","PVP"],
 was:["Wer eine Fracht abliefert, kann optional einen Frachtbrief ausstellen: Die Route wird öffentlich angekündigt, die Belohnung ist doppelt."],
 wie:["Freiwilliges Risiko gegen freiwilligen Ertrag. Spieler, die Action wollen, malen sich selbst eine Zielscheibe auf den Rücken — und der Server bekommt garantierte Konvoi-Überfälle, ohne dass jemand sie planen musste."],
 links:[{to:"pvp",why:"Erzeugt planbare, freiwillige Konvoi-Überfälle."},{to:"ressourcen",why:"Verdoppelt den Frachtwert gegen Risiko."},{to:"idee-13",why:"Kombinierbar mit verderblicher Fracht für maximale Hektik."}]},
{id:"idee-21", nr:21, cat:"Territorium und Welt", title:"Die wandernde Zitadelle", origin:"kern", tags:["EM","PVP","LZ"],
 was:["Die Zitadelle steht nicht fest: Alle 14 Tage verschwindet sie und erscheint an einem neuen Ort, der 48 h vorher angekündigt wird."],
 wie:["Das erzwingt ein Wettrennen und verhindert, dass eine Fraktion einfach dauerhaft daneben baut. Die Machtgeografie des Servers wird alle zwei Wochen neu gemischt."],
 links:[{to:"endgame",why:"Verschärft die Zitadelle aus dem Endgame-System."},{to:"belagerung",why:"Bleibt außerhalb der Fenster belagerbar."},{to:"season",why:"Mischt die Machtgeografie über die Kapitel neu."}]},
{id:"idee-22", nr:22, cat:"Territorium und Welt", title:"Regionale Wetter- und Umweltsysteme", origin:"kern", tags:["EM","WW"],
 was:["Regionen haben permanente Umweltcharakteristika: Der Norden erzeugt Kälteschaden ohne passende Ausrüstung, die Wüste kostet Wasser, die Sümpfe verlangsamen."],
 wie:["Das macht Territorium charakteristisch statt austauschbar und verändert Kampfausrüstung je nach Front. Wer im Norden angreift, muss anders packen als im Süden."],
 links:[{to:"claims",why:"Gibt jedem Territorium einen eigenen Charakter."},{to:"pvp",why:"Zwingt zu frontabhängiger Ausrüstung."},{to:"ressourcen",why:"Verstärkt die regionale Arbeitsteilung."}]},
{id:"idee-23", nr:23, cat:"Territorium und Welt", title:"Der Nebel", origin:"kern", tags:["EM","WW"],
 was:["Ein Teil der Karte ist zu Season-Beginn nicht kartiert. Wer als Erster eine Region betritt, wird als Entdecker in der Chronik verewigt und die Region wird auf der Dynmap für alle sichtbar."],
 wie:["Der Anreiz zu erkunden ist Prestige, nicht Loot. Kostet fast nichts in der Entwicklung und liefert die ersten zwei Wochen Season-Content gratis."],
 links:[{to:"chronik",why:"Entdeckungen werden namentlich verewigt."},{to:"season",why:"Trägt die ersten zwei Wochen (Landnahme) mit Content."},{to:"progression",why:"„Erkunde unentdeckte Regionen“ ist ein Daily."}]},
{id:"idee-24", nr:24, cat:"Territorium und Welt", title:"Grenzsteine", origin:"kern", tags:["EM","TP"],
 was:["Claims werden nicht per Command gesetzt, sondern durch physisch platzierte Grenzsteine, die in der Welt stehen und — nur während Belagerungen — zerstörbar sind."],
 wie:["Grenzen sind Objekte, keine Zahlen. Man kann sie sehen, fotografieren, darum kämpfen. Die konsequente Weiterführung des bestehenden Redstone-Fackel-Systems in den Kriegskontext."],
 links:[{to:"claims",why:"Macht Claims zu physischen, sichtbaren Objekten."},{to:"belagerung",why:"Grenzsteine sind nur während Belagerungen zerstörbar."},{to:"onboarding",why:"Baut auf dem bekannten Redstone-Fackel-System auf."}]},
{id:"idee-25", nr:25, cat:"Territorium und Welt", title:"Der Landweg", origin:"kern", tags:["EM","TP","LZ"],
 was:["Der Nether ist für Highways nutzbar (wie im Survival), aber Nether-Portale in fremdem Territorium sind blockiert und Nether-Highways können in der Wildnis von jedem zerstört werden."],
 wie:["Die Community baut das Straßennetz gemeinsam — und das Straßennetz wird zum strategischen Ziel. Übernimmt die Highway-Kultur des Survival-Servers und macht sie kriegsrelevant."],
 links:[{to:"pvp",why:"Das Straßennetz wird zum Logistik- und Kriegsziel."},{to:"idee-11",why:"Trägt die gebauten Handelsrouten."},{to:"community",why:"Gemeinsam gebaute Infrastruktur bindet die Community."}]},
{id:"idee-26", nr:26, cat:"Territorium und Welt", title:"Bodenqualität", origin:"kern", tags:["EM","WW"],
 was:["Chunks haben unsichtbare Eigenschaften (Erzdichte, Fruchtbarkeit, Bauuntergrund), die man mit einem Werkzeug vermessen kann. Ein guter Chunk ist nicht offensichtlich."],
 wie:["Das erzeugt eine Aufklärungs-Rolle vor der Landnahme und belohnt Spieler, die sich vorbereiten, statt Spieler, die zuerst da sind."],
 links:[{to:"claims",why:"Macht die Standortwahl zu einer informierten Entscheidung."},{to:"idee-46",why:"Der Kartograf-Beruf kann Bodenqualität sehen."},{to:"ressourcen",why:"Verbindet Standort mit Ertragspotenzial."}]},
{id:"idee-27", nr:27, cat:"Territorium und Welt", title:"Die Ruinen", origin:"kern", tags:["WW","EM"],
 was:["An zufälligen Orten der Wildnis generieren sich Ruinen der vergangenen Season — vereinfachte Nachbildungen echter Spielerbasen aus der letzten Season, mit dem Namen der Erbauer."],
 wie:["Sie sind plünderbar, enthalten kleine Belohnungen und ein Chronik-Fragment. Der Server erzählt seine eigene Geschichte durch die Landschaft. Technisch mit einem Schematic-Export am Season-Ende machbar."],
 links:[{to:"season",why:"Trägt die letzte Season physisch in die neue Welt."},{to:"chronik",why:"Ruinen enthalten Chronik-Fragmente."},{to:"community",why:"Emotionale Würdigung vergangener Basen."}]},
{id:"idee-28", nr:28, cat:"Territorium und Welt", title:"Aufgegebene Territorien verfallen sichtbar", origin:"kern", tags:["EM","LZ"],
 was:["Ein Chunk, dessen Fraktion inaktiv wird, verwildert optisch schrittweise (Moos, Ranken, Risse) — als sichtbares Signal, bevor er freigegeben wird."],
 wie:["Man sieht auf der Karte, wo der Server stirbt und wo er lebt — und man sieht rechtzeitig, wo bald Land frei wird."],
 links:[{to:"claims",why:"Signalisiert bevorstehende Claim-Freigabe visuell."},{to:"season",why:"Macht Aktivität und Verfall über die Season sichtbar."},{to:"idee-36",why:"Ergänzt die Erbfolge als Anti-Inaktivitäts-Signal."}]},
{id:"idee-29", nr:29, cat:"Territorium und Welt", title:"Der Leuchtturm", origin:"kern", tags:["TP","LZ"],
 was:["Ein Prestige-Bauwerk, das im Umkreis von 500 Blöcken alle Fraktionsmitglieder auf der Karte für die eigene Fraktion sichtbar macht. Teuer, sichtbar, angreifbar."],
 wie:["Es gibt keinen Kampfvorteil, nur Information — und Information ist im Krieg die wertvollste Ressource."],
 links:[{to:"endgame",why:"Ein Prestige-Bauwerk im Endgame-Sinn."},{to:"pvp",why:"Aufklärung als gebaute Struktur."},{to:"cosmetics",why:"Sichtbares Statussymbol auf der Dynmap."}]},
{id:"idee-30", nr:30, cat:"Territorium und Welt", title:"Naturkatastrophen mit Vorwarnung", origin:"kern", tags:["EM","WW"],
 was:["Ein Erdrutsch/Vulkan/Sturm wird 72 h vorher angekündigt und trifft eine benannte Region. Die dort ansässige Fraktion muss entscheiden: evakuieren, verstärken oder aufgeben."],
 wie:["Erzeugt Umbrüche, die niemand persönlich verursacht hat — der Server als dritter Spieler, ohne dass ein Admin eingreift."],
 links:[{to:"events",why:"Eine Sonderform der Weltereignisse mit permanenter Wirkung."},{to:"claims",why:"Zwingt zu Evakuierungs-/Verstärkungsentscheidungen."},{to:"adminevents",why:"Live streambar als Show mit Konsequenz."}]},
{id:"idee-31", nr:31, cat:"Fraktionen und Teamplay", title:"Die Rollenpflicht", origin:"kern", tags:["TP","EM"],
 was:["Eine Fraktion kann nur so viele Chunks halten, wie sie Rollen besetzt hat: Ein Quartiermeister, ein Diplomat, ein Baumeister, ein Späher sind für die Ausbaustufe erforderlich."],
 wie:["Ein Clan aus 10 PvP-Spielern kann nicht expandieren. Das macht Nicht-Kämpfer nicht nur nützlich, sondern strukturell notwendig — und ist die Antwort auf „Warum sollte ein Builder auf einen Factions-Server kommen?“"],
 links:[{to:"claims",why:"Koppelt Claim-Kapazität an besetzte Rollen."},{to:"progression",why:"Macht die Fraktionsränge spielentscheidend."},{to:"onboarding",why:"Schafft echten Bedarf für Nicht-PvP-Spielertypen."}]},
{id:"idee-32", nr:32, cat:"Fraktionen und Teamplay", title:"Die Ratsversammlung", origin:"kern", tags:["TP","EM"],
 was:["Fraktionsentscheidungen (Kriegserklärung, Vertrag, Kernblock-Verlegung) können optional an eine interne Abstimmung gebunden werden, die der Anführer aktiviert."],
 wie:["Das Ergebnis ist bindend und geht in die Chronik. Clans, die es nutzen, bekommen einen kleinen Mandat-Bonus („Einigkeit“). Demokratie als Spielmechanik — und ein Werkzeug gegen Anführer-Willkür, den häufigsten Grund für Clan-Zerfall."],
 links:[{to:"diplomatie",why:"Bindet diplomatische Akte an Fraktionsabstimmungen."},{to:"progression",why:"Belohnt Einigkeit mit einem Mandat-Bonus."},{to:"chronik",why:"Abstimmungsergebnisse werden verewigt."}]},
{id:"idee-33", nr:33, cat:"Fraktionen und Teamplay", title:"Die Lehre", origin:"kern", tags:["TP","LZ"],
 was:["Ein erfahrener Spieler kann einen Neuling als Lehrling annehmen. Beide bekommen Fortschritt, wenn der Lehrling Meilensteine erreicht."],
 wie:["Der Mentor bekommt einen sichtbaren Titel und Chronik-Einträge für jeden Lehrling, der es weit bringt. Onboarding wird von einer Team-Aufgabe zu einem Community-Feature — bei einer Whitelist-Community mit hoher Bindung außergewöhnlich wirksam."],
 links:[{to:"onboarding",why:"Macht aus Onboarding ein Mentoren-Feature."},{to:"community",why:"Nutzt die hohe soziale Bindung der Whitelist-Community."},{to:"progression",why:"Mentor-Titel und Chronik-Einträge als Belohnung."}]},
{id:"idee-34", nr:34, cat:"Fraktionen und Teamplay", title:"Der Eid", origin:"kern", tags:["EM","TP"],
 was:["Beim Beitritt leistet ein Spieler einen Eid mit selbstgewählter Mindestbindungsdauer (7/14/30 Tage). Vorzeitiger Austritt kostet Ansehen und wird in der Chronik vermerkt."],
 wie:["Längere Eide geben der Fraktion mehr Mandat. Clan-Hopping wird nicht verboten, sondern hat Kosten. Und ein 30-Tage-Eid ist ein Statement, das man sichtbar trägt."],
 links:[{to:"progression",why:"Der Eid ist ein sichtbar getragenes Commitment."},{to:"oekonomie",why:"Längere Eide erhöhen das Fraktions-Mandat."},{to:"idee-48",why:"Speist das Ansehen-System bei Eidbruch."}]},
{id:"idee-35", nr:35, cat:"Fraktionen und Teamplay", title:"Split-Mechanik", origin:"kern", tags:["EM","LZ"],
 was:["Eine Fraktion kann sich offiziell spalten: Ein Offizier gründet eine Tochterfraktion, nimmt seine Anhänger und einen Teil des Territoriums mit."],
 wie:["Das Verhältnis zur Mutterfraktion ist frei wählbar (Bündnis oder Krieg). Statt dass ein zerstrittener Clan im Discord implodiert und alle aufhören, produziert der Streit einen neuen Akteur. Der häufigste Community-Killer wird zum Content-Generator."],
 links:[{to:"diplomatie",why:"Die Tochterfraktion startet mit einem gewählten Beziehungsstatus."},{to:"claims",why:"Territorium wird bei der Spaltung geteilt."},{to:"community",why:"Verhindert, dass ein Clan-Streit die Community leert."}]},
{id:"idee-36", nr:36, cat:"Fraktionen und Teamplay", title:"Erbfolge", origin:"kern", tags:["EM","LZ"],
 was:["Wird ein Anführer 14 Tage inaktiv, übernimmt automatisch der Offizier mit der höchsten Beitragsleistung — nach einer öffentlichen 48-h-Vorwarnung."],
 wie:["Verhindert den Klassiker „Anführer hört auf, Clan mit 20 aktiven Leuten ist tot“. Ein Detail, das kaum jemand bemerkt und das Dutzende Spielerkarrieren rettet."],
 links:[{to:"progression",why:"Nutzt die Beitragsleistung zur Nachfolgebestimmung."},{to:"community",why:"Rettet aktive Clans vor dem Anführer-Ausfall."},{to:"idee-28",why:"Greift, bevor Territorium sichtbar verfällt."}]},
{id:"idee-37", nr:37, cat:"Fraktionen und Teamplay", title:"Fraktionsgedächtnis", origin:"kern", tags:["LZ","EM"],
 was:["Jede Fraktion hat eine permanente Seite mit ihrer gesamten Geschichte über alle Seasons hinweg: Gründung, Anführer, Kriege, Siege, Spaltungen."],
 wie:["Wer eine Fraktion mit demselben Namen neu gründet, erbt die Chronik. Ein Fraktionsname wird über Jahre zu einer Marke innerhalb der Community — der stärkste denkbare Cross-Season-Übertrag, und er kostet null Balance."],
 links:[{to:"chronik",why:"Aggregiert die Chronik zu einer permanenten Fraktionsbiografie."},{to:"season",why:"Der einzige erlaubte Cross-Season-Übertrag — reine Geschichte."},{to:"community",why:"Macht Fraktionsnamen zu langlebigen Marken."}]},
{id:"idee-38", nr:38, cat:"Fraktionen und Teamplay", title:"Gastrecht", origin:"kern", tags:["TP","EM"],
 was:["Eine Fraktion kann einzelnen fremden Spielern Gastrecht gewähren: Betreten und Bauen in einem definierten Bereich, kein Lagerzugriff."],
 wie:["Ermöglicht neutrale Händler, befreundete Builder und Diplomaten in fremden Basen. Kleine Mechanik, riesige soziale Wirkung — plötzlich sind fremde Basen Orte, die man besuchen kann."],
 links:[{to:"diplomatie",why:"Erweitert Beziehungen um Einzelperson-Zugang."},{to:"community",why:"Macht fremde Basen zu besuchbaren Orten."},{to:"idee-40",why:"Voraussetzung für Bürgen im Vertrauensbeweis."}]},
{id:"idee-39", nr:39, cat:"Fraktionen und Teamplay", title:"Die gemeinsame Schuld", origin:"kern", tags:["EM","TP"],
 was:["Wenn ein Fraktionsmitglied einen Vertrag bricht oder gegen eine Waffenruhe verstößt, trägt die ganze Fraktion den Ansehensverlust."],
 wie:["Clans müssen ihre eigenen Leute kontrollieren. Das erzeugt internen sozialen Druck statt Moderationsaufwand — genau der Mechanismus, mit dem CastCrafters Whitelist-Kultur ohnehin arbeitet."],
 links:[{to:"kriegszustaende",why:"Erweitert die Haftungslogik des Vertragsbruchs."},{to:"idee-48",why:"Wirkt über den Ansehen-Wert der Fraktion."},{to:"community",why:"Ersetzt Moderationsaufwand durch sozialen Druck."}]},
{id:"idee-40", nr:40, cat:"Fraktionen und Teamplay", title:"Der Vertrauensbeweis", origin:"kern", tags:["EM","TP"],
 was:["Zwei verfeindete Fraktionen können Geiseln/Bürgen austauschen: Ein Spieler jeder Seite geht freiwillig für die Vertragslaufzeit in das Territorium der anderen (mit Gastrecht)."],
 wie:["Bricht eine Seite den Vertrag, verliert ihr Bürge Ausrüstung und die Fraktion massiv Ansehen. Ein mittelalterliches Konzept, das in Minecraft noch niemand gebaut hat — und das die intensivsten Rollenspielmomente erzeugt, die ein Factions-Server haben kann."],
 links:[{to:"diplomatie",why:"Die intensivste Vertrauensstufe im Vertragssystem."},{to:"idee-38",why:"Nutzt das Gastrecht für den Bürgen-Aufenthalt."},{to:"idee-48",why:"Vertragsbruch trifft das Ansehen massiv."}]},
{id:"idee-41", nr:41, cat:"Fortschritt und Motivation", title:"Der Chronik-Score", origin:"kern", tags:["LZ","EM"],
 was:["Ein persönlicher Wert, der nicht durch Grind steigt, sondern dadurch, wie oft man in bedeutsamen Chronik-Einträgen vorkommt: Belagerungen entschieden, Verträge verhandelt, Reliquien gefunden, Konvois gerettet."],
 wie:["Er ist nicht farmbar, weil er nur durch Beteiligung an Ereignissen steigt, die andere Menschen ebenfalls erlebt haben. Der ehrlichste Prestige-Wert, den man bauen kann."],
 links:[{to:"chronik",why:"Leitet sich direkt aus den Chronik-Einträgen ab."},{to:"progression",why:"Ein grind-freier Prestige-Wert neben den Rängen."},{to:"toplisten",why:"Kann eine eigene, nicht-farmbare Topliste speisen."}]},
{id:"idee-42", nr:42, cat:"Fortschritt und Motivation", title:"Meisterschaften statt Level", origin:"kern", tags:["LZ","WW"],
 was:["Kein Spieler-Level. Stattdessen dutzende kleine Meisterschaften mit je 5 Stufen (Bergbau in der Wildnis, Fracht unter Beschuss, Verteidigung von Kontrollpunkten, Dungeon-Zeiten, Handelsvolumen)."],
 wie:["Jede gibt einen Titel und ein Cosmetic, keine Werte. Es gibt immer noch etwas zu erreichen, und jeder Spielertyp hat seine eigene Progression."],
 links:[{to:"progression",why:"Ersetzt ein einzelnes Level durch viele parallele Fortschritte."},{to:"cosmetics",why:"Belohnt mit Titeln und Cosmetics, nie mit Werten."},{to:"toplisten",why:"Speist spezialisierte Bestenlisten."}]},
{id:"idee-43", nr:43, cat:"Fortschritt und Motivation", title:"Der Nachruf", origin:"kern", tags:["EM","LZ"],
 was:["Wenn ein Spieler eine Fraktion dauerhaft verlässt oder eine Fraktion sich auflöst, generiert das System einen Nachruf-Eintrag mit den wichtigsten Momenten."],
 wie:["Klingt morbide, ist aber Würdigung: Nichts verschwindet einfach. Bei einer Community, die zusammen Videos schaut, ist das ein starkes Signal."],
 links:[{to:"chronik",why:"Der Nachruf ist ein automatischer Chronik-Eintrag."},{to:"community",why:"Würdigung statt kommentarlosem Verschwinden."},{to:"idee-37",why:"Ergänzt das Fraktionsgedächtnis um ein Ende."}]},
{id:"idee-44", nr:44, cat:"Fortschritt und Motivation", title:"Rückkehrer-Fenster", origin:"kern", tags:["LZ"],
 was:["Ein Spieler, der 14+ Tage weg war, bekommt beim Login eine Zusammenfassung, seine alten Dailies gutgeschrieben (gedeckelt) und 48 h lang doppelten BattlePass-Fortschritt."],
 wie:["Kein Pay2Win, keine Ressourcen — nur ein sanfter Wiedereinstieg. Wer zurückkommt, soll nicht 4 Wochen hinterherhinken."],
 links:[{to:"progression",why:"Doppelter BattlePass-Fortschritt beim Wiedereinstieg."},{to:"onboarding",why:"Re-Onboarding für Rückkehrer statt Neulinge."},{to:"community",why:"Senkt die Hürde zurückzukommen."}]},
{id:"idee-45", nr:45, cat:"Fortschritt und Motivation", title:"Der Rivalen-Tracker", origin:"kern", tags:["PVP","LZ","EM"],
 was:["Das System erkennt automatisch, gegen welchen Spieler oder welche Fraktion man am häufigsten gekämpft hat, und zeigt eine persönliche Bilanz: Siege, Niederlagen, Belagerungen, letzte Begegnung."],
 wie:["Aus anonymem PvP wird eine benannte Rivalität. Am Season-Ende bekommt jeder seinen „Erzfeind der Season“ in die Rückblick-Karte. Der billigste Weg, Bindung zu erzeugen."],
 links:[{to:"toplisten",why:"Macht aus anonymem PvP eine benannte, gelistete Rivalität."},{to:"chronik",why:"Der Erzfeind landet in der Season-Rückblick-Karte."},{to:"pvp",why:"Gibt jedem Feldkampf eine Fortsetzungsgeschichte."}]},
{id:"idee-46", nr:46, cat:"Fortschritt und Motivation", title:"Saisonale Berufe", origin:"kern", tags:["WW","LZ","EM"],
 was:["Zu Season-Beginn wählt jeder Spieler einen von acht Berufen (Schmied, Kartograf, Fuhrmann, Späher, Alchemist, Baumeister, Händler, Söldner). Der Beruf gibt keine Kampfvorteile, sondern exklusive Fähigkeiten in seinem Feld."],
 wie:["Der Kartograf sieht Chunk-Bodenqualität, der Fuhrmann trägt mehr Fracht, der Schmied repariert billiger. Man kann pro Season nur einen Beruf haben — jede Season spielt man ein anderes Spiel. Der stärkste Wiederspielwert-Hebel im ganzen Konzept."],
 links:[{to:"progression",why:"Gibt jeder Season eine eigene Spielweise und Progression."},{to:"pvp",why:"Verteilt kriegsentscheidende Nicht-Kampf-Rollen."},{to:"idee-26",why:"Der Kartograf-Beruf liest Bodenqualität."}]},
{id:"idee-47", nr:47, cat:"Fortschritt und Motivation", title:"Der offene Auftrag", origin:"kern", tags:["TP","LZ"],

 wie:["Hohes Ansehen senkt Vertragskosten und macht mehr Söldner verfügbar (Söldner arbeiten ungern für Vertragsbrecher). Der freundliche Weg ist damit ein strategisch valider Weg — nicht nur ein moralischer. Ungewöhnlich, und passt exakt zur CastCrafter-Kultur."],

{id:"idee-49", nr:49, cat:"Fortschritt und Motivation", title:"Der stille Rekord", origin:"kern", tags:["WW","EM"],

<script>
/* ============================================================
   ENGINE
   ============================================================ */
(function(){
  "use strict";
  var byId = {};
  function index(){
    (window.SYSTEMS||[]).forEach(function(s){ s._kind="system"; byId[s.id]=s; });
    (window.IDEAS||[]).forEach(function(i){ i._kind="idee"; byId[i.id]=i; });
  }
  function esc(s){return (s==null?"":String(s));}
  function route(id){
    var it=byId[id]; if(!it) return "#/";
    return it._kind==="system" ? "#/system/"+id : "#/idee/"+id;
  }
  function titleOf(id){var it=byId[id];return it?it.title:id;}
  function catAccent(cat){
    return ({"Krieg und Belagerung":"var(--war)","Wirtschaft und Logistik":"var(--gold)","Territorium und Welt":"var(--moss)","Fraktionen und Teamplay":"var(--peace)","Fortschritt und Motivation":"var(--ausbau)"})[cat]||"var(--war)";
  }

  /* ---- renderers ---- */
  function chip(html,cls,c){return '<span class="chip '+(cls||'')+'"'+(c?' data-c="'+c+'"':'')+'>'+html+'</span>';}
  function tagChips(tags){return (tags||[]).map(function(t){return chip(t+' · '+(window.TAGS[t]||''),'',t);}).join('');}
  function originChip(o){return o==='ausbau'?chip('Ausbau','chip--ausbau'):chip('Aus dem Konzept','chip--kern');}

  function proseBlocks(arr){
    return (arr||[]).map(function(b){
      if(typeof b==='string') return '<p>'+b+'</p>';
      if(b.ul) return '<ul>'+b.ul.map(function(li){return '<li>'+li+'</li>';}).join('')+'</ul>';
      if(b.ausbau) return ausbauBlock(b.ausbau);
      if(b.callout) return calloutBlock(b);
      return '';
    }).join('');
  }
  function ausbauBlock(items){
    var arr = Array.isArray(items)?items:[items];
    return '<div class="ausbau"><div class="ausbau__tag">Ausbau — meine Ergänzung</div>'+arr.map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>';
  }
  function calloutBlock(b){
    return '<div class="callout callout--'+(b.tone||'war')+'">'+(b.l?'<div class="callout__l">'+b.l+'</div>':'')+'<p>'+b.callout+'</p></div>';
  }
  function linkBlock(links){
    if(!links||!links.length) return '<p style="color:var(--ink-faint)">—</p>';
    return '<div class="links">'+links.map(function(l){
      return '<div class="link" data-go="'+route(l.to)+'"><div class="link__to"><span class="arrow">▸</span>'+titleOf(l.to)+'</div><div class="link__why">'+l.why+'</div></div>';
    }).join('')+'</div>';
  }

  function systemNeighbors(id){
    var s=byId[id], set={};
    (s.links||[]).forEach(function(l){set[l.to]=1;});
    (window.SYSTEMS||[]).forEach(function(o){(o.links||[]).forEach(function(l){if(l.to===id)set[o.id]=1;});});
    return Object.keys(set);
  }

  function viewSystem(id){
    var s=byId[id]; if(!s) return viewHome();
    var idx=window.SYSTEMS.indexOf(s);
    var prev=window.SYSTEMS[idx-1], next=window.SYSTEMS[idx+1];
    var h='';
    h+='<div class="crumb"><a href="#/">Übersicht</a><span class="crumb__sep">/</span>Kernsysteme<span class="crumb__sep">/</span>'+s.title+'</div>';
    h+='<div class="eyebrow">'+(s.kicker||'Kernsystem')+'</div>';
    h+='<h1 class="title">'+s.title+'</h1>';
    if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
    h+='<div class="chips">'+ (s.status?chip(s.status,'chip--status'):'') + originChip(s.origin||'kern') + tagChips(s.tags) +'</div>';

    h+='<h2 class="sec" data-k="Was">Was ist das?</h2><div class="prose">'+proseBlocks(s.was)+'</div>';
    h+='<h2 class="sec" data-k="Wie" data-tone="war">Wie funktioniert es?</h2><div class="prose">'+proseBlocks(s.wie)+'</div>';
    if(s.warum){h+='<h2 class="sec" data-k="Warum" data-tone="peace">Warum</h2><div class="prose">'+proseBlocks(s.warum)+'</div>';}
    h+='<h2 class="sec" data-k="⇄">Verbindungen</h2>'+linkBlock(s.links);

    h+='<div class="pagenav">';
    h+= prev?'<a href="'+route(prev.id)+'"><span class="dir">◂ zurück</span>'+prev.title+'</a>':'<span></span>';
    h+= next?'<a class="r" href="'+route(next.id)+'"><span class="dir">weiter ▸</span>'+next.title+'</a>':'<span></span>';
    h+='</div>';
    return h;
  }

  function viewIdee(id){
    var it=byId[id]; if(!it) return viewHome();
    var idx=window.IDEAS.indexOf(it);
    var prev=window.IDEAS[idx-1], next=window.IDEAS[idx+1];
    var h='';
    h+='<div class="crumb"><a href="#/">Übersicht</a><span class="crumb__sep">/</span><a href="#/ideen">50 Feature-Ideen</a><span class="crumb__sep">/</span>Nr. '+it.nr+'</div>';
    h+='<div class="eyebrow">Teil C · '+it.cat+' · Idee '+it.nr+'/50</div>';
    h+='<h1 class="title title--sm">'+it.title+'</h1>';
    h+='<div class="chips">'+originChip(it.origin||'kern')+tagChips(it.tags)+'</div>';
    h+='<h2 class="sec" data-k="Was">Was ist das?</h2><div class="prose">'+proseBlocks(it.was)+'</div>';
    h+='<h2 class="sec" data-k="Wie" data-tone="war">Wie funktioniert es?</h2><div class="prose">'+proseBlocks(it.wie)+'</div>';
    if(it.warum){h+='<h2 class="sec" data-k="Warum" data-tone="peace">Warum</h2><div class="prose">'+proseBlocks(it.warum)+'</div>';}
    h+='<h2 class="sec" data-k="⇄">Verbindungen</h2>'+linkBlock(it.links);
    h+='<div class="pagenav">';
    h+= prev?'<a href="'+route(prev.id)+'"><span class="dir">◂ Idee '+prev.nr+'</span>'+prev.title+'</a>':'<a href="#/ideen"><span class="dir">◂</span>Katalog</a>';
    h+= next?'<a class="r" href="'+route(next.id)+'"><span class="dir">Idee '+next.nr+' ▸</span>'+next.title+'</a>':'<a class="r" href="#/ideen"><span class="dir">▸</span>Katalog</a>';
    h+='</div>';
    return h;
  }

  function viewIdeen(){
    var h='';
    h+='<div class="crumb"><a href="#/">Übersicht</a><span class="crumb__sep">/</span>50 Feature-Ideen</div>';
    h+='<div class="eyebrow">Teil C</div><h1 class="title title--sm">50 neue Feature-Ideen</h1>';
    h+='<p class="lede">Ideen, die dem Autor auf deutschen Factions-Servern nicht bekannt sind — jede P2W-frei, mit eigener Pluginentwicklung umsetzbar, und auf mindestens zwei der Ziele Langzeitmotivation, PvP, Teamplay, Wiederspielwert und einzigartige Mechanik einzahlend.</p>';
    h+='<div class="filter" id="filter">';
    h+='<input class="filter__search" id="q" placeholder="Ideen durchsuchen …">';
    ['LZ','PVP','TP','WW','EM'].forEach(function(t){h+='<button class="toggle" data-c="'+t+'" data-tag="'+t+'">'+t+'</button>';});
    h+='<span class="filter__count" id="count"></span></div>';
    h+='<div class="grid" id="ideagrid"></div>';
    return h;
  }
  function renderIdeaGrid(){
    var q=(document.getElementById('q')||{}).value||'';
    q=q.toLowerCase().trim();
    var active=[].slice.call(document.querySelectorAll('#filter .toggle.is-on')).map(function(b){return b.dataset.tag;});
    var grid=document.getElementById('ideagrid'); if(!grid) return;
    var list=window.IDEAS.filter(function(it){
      if(active.length && !active.every(function(t){return (it.tags||[]).indexOf(t)>=0;})) return false;
      if(q){var blob=(it.title+' '+it.cat+' '+plain(it.was)+' '+plain(it.wie)).toLowerCase();if(blob.indexOf(q)<0)return false;}
      return true;
    });
    grid.innerHTML=list.map(function(it){
      return '<div class="card" data-go="'+route(it.id)+'" style="--accent:'+catAccent(it.cat)+'">'+
        '<div class="card__nr">Nr. '+it.nr+' · '+it.cat+'</div>'+
        '<div class="card__title">'+it.title+'</div>'+
        '<div class="card__desc">'+plain(it.was).slice(0,140)+'…</div>'+
        '<div class="card__foot">'+ (it.tags||[]).map(function(t){return chip(t,'',t);}).join('') +'</div>'+
      '</div>';
    }).join('');
    var c=document.getElementById('count'); if(c) c.textContent=list.length+' / 50';
  }
  function plain(arr){
    return (arr||[]).map(function(b){
      if(typeof b==='string')return b;
      if(b.ul)return b.ul.join(' ');
      if(b.ausbau)return (Array.isArray(b.ausbau)?b.ausbau.join(' '):b.ausbau);
      if(b.callout)return b.callout;
      return '';
    }).join(' ').replace(/<[^>]+>/g,'');
  }

  function viewHome(){
    var h='';
    h+='<div class="hero">';
    h+='<div class="hero__eyebrow">Konzeptpapier für einen Factions-Server 2026 · Arbeitstitel</div>';
    h+='<h1 class="hero__mark">FRON<span>TEN</span></h1>';
    h+=frontlineSVG();
    h+='<div class="hero__thesis">Man verliert Territorium, Ressourcen und Rang — aber niemals die Base, in die man 40 Stunden gesteckt hat. <b>Man kämpft um Kontrolle, nicht um Existenz.</b></div>';
    h+='<div class="hero__meta">'+
        hstat(window.SYSTEMS.length,'Kernsysteme')+
        hstat('50','Feature-Ideen')+
        hstat('14','Plugin-Module')+
        hstat('~18','Wochen / Season')+
        hstat('7','Herzen / Woche')+
      '</div>';
    h+='</div>';

    h+='<div class="blockhead"><div class="blockhead__k">Das Profil — 5 Säulen</div><div class="blockhead__t">Was es auf keinem deutschen Factions-Server gibt</div><div class="blockhead__d">Fünf Entscheidungen, die zusammen ein Profil ergeben. Jede erbt aus der bestehenden CastCrafter-DNA: Zeit als einzige harte Währung, kein Server-Shop, erzwungene Spielerinteraktion, Vanilla-Gefühl vor Feature-Overload.</div></div>';
    h+=window.PILLARS.map(function(p,i){
      return '<div class="pillar" data-go="'+route(p.to)+'" style="cursor:pointer"><div class="pillar__nr">'+(i+1)+'</div><div><div class="pillar__t">'+p.t+'</div><div class="pillar__d">'+p.d+'</div></div></div>';
    }).join('');

    h+='<div class="blockhead"><div class="blockhead__k">Einstieg</div><div class="blockhead__t">Erkunde das Konzept</div></div>';
    h+='<div class="grid">'+
      navCard('#/system/belagerung','Kernsysteme','Das Belagerungssystem, Lebenssystem, Ökonomie, Diplomatie & mehr — ausführlich erklärt.','var(--war)')+
      navCard('#/ideen','50 Feature-Ideen','Der durchsuchbare Katalog aller Ideen aus Teil C, filterbar nach Fokus.','var(--gold)')+
      navCard('#/graph','Lagekarte','Der interaktive Verbindungs-Graph: wie alle Systeme voneinander abhängen.','var(--peace)')+
      navCard('#/umsetzung','Umsetzung','Die vier blockierenden Entscheidungen und der Season-1-Fahrplan.','var(--moss)')+
      navCard('#/fragen','Offene Fragen','Team-Entscheidungen aus Teil B.5 und D — mit meiner Empfehlung.','var(--ausbau)')+
    '</div>';

    h+='<div class="callout callout--peace" style="margin-top:40px"><div class="callout__l">Zum Ausbau-Status</div><p><strong>„Aus dem Konzept“</strong> markiert Inhalte des Original-Papiers. <strong style="color:var(--ausbau)">◆ Ausbau</strong>-Blöcke sind meine Ergänzungen: konkrete Zahlenvorschläge statt Platzhalter, Balancing-Hinweise und Empfehlungen zu offenen Fragen. Alle Original-Zahlenwerte sind laut Papier Platzhalter für Balancing-Tests.</p></div>';
    return h;
  }
  function hstat(n,l){return '<div class="hstat"><div class="hstat__n">'+n+'</div><div class="hstat__l">'+l+'</div></div>';}
  function navCard(go,t,d,acc){return '<div class="card" data-go="'+go+'" style="--accent:'+acc+'"><div class="card__title">'+t+'</div><div class="card__desc">'+d+'</div></div>';}
  function frontlineSVG(){
    return '<svg class="hero__frontline" viewBox="0 0 1000 34" preserveAspectRatio="none" aria-hidden="true">'+
      '<path id="fl" d="M0 17 L120 17 L150 6 L180 26 L210 12 L260 20 L300 8 L340 24 L380 14 L440 17 L1000 17" fill="none" stroke="var(--war)" stroke-width="2" stroke-dasharray="1600" stroke-dashoffset="1600"><animate attributeName="stroke-dashoffset" from="1600" to="0" dur="1.6s" fill="freeze"/></path>'+
      '<circle r="3" fill="var(--war)"><animateMotion dur="1.6s" fill="freeze"><mpath href="#fl"/></animateMotion></circle>'+
    '</svg>';
  }

  /* ---------- GRAPH ---------- */
  function viewGraph(){
    return '<div class="crumb"><a href="#/">Übersicht</a><span class="crumb__sep">/</span>Lagekarte</div>'+
      '<div class="eyebrow">Verbindungen</div><h1 class="title title--sm">Die Lagekarte</h1>'+
      '<p class="lede">Jeder Knoten ist ein Kernsystem, jede Linie eine Abhängigkeit. Das Konzept ist kein Feature-Katalog, sondern ein Geflecht — kaum ein System steht allein. Ziehen zum Verschieben, Scrollen zum Zoomen, Klick öffnet das System.</p>'+
      '<div class="graphwrap" id="graphwrap"><div class="graph-hint">ziehen · zoomen · klicken</div>'+
      '<div class="graph-legend"><span><i style="background:var(--war)"></i>Krieg / Territorium</span><span><i style="background:var(--gold)"></i>Wirtschaft / Welt</span><span><i style="background:var(--peace)"></i>Fraktion / Diplomatie</span><span><i style="background:var(--ausbau)"></i>Fortschritt / Meta</span></div>'+
      '</div>';
  }
  function nodeColor(id){
    for(var i=0;i<window.NAVGROUPS.length;i++){if(window.NAVGROUPS[i].ids.indexOf(id)>=0){
      return ['var(--war)','var(--gold)','var(--peace)','var(--ausbau)'][i];
    }}
    return 'var(--ink-faint)';
  }
  function buildGraph(){
    var wrap=document.getElementById('graphwrap'); if(!wrap) return;
    var W=1000,H=680;
    var nodes=window.SYSTEMS.map(function(s){return {id:s.id,label:s.title,r:0};});
    var nmap={}; nodes.forEach(function(n,i){n.i=i;nmap[n.id]=n;});
    var edges=[];
    window.SYSTEMS.forEach(function(s){(s.links||[]).forEach(function(l){
      if(nmap[l.to]&&l.to!==s.id) edges.push([nmap[s.id],nmap[l.to]]);
    });});
    // degree -> radius
    var deg={}; edges.forEach(function(e){deg[e[0].id]=(deg[e[0].id]||0)+1;deg[e[1].id]=(deg[e[1].id]||0)+1;});
    nodes.forEach(function(n){n.r=7+Math.min(12,(deg[n.id]||0)*1.4);});
    // init circle
    nodes.forEach(function(n,i){var a=i/nodes.length*Math.PI*2;n.x=W/2+Math.cos(a)*300;n.y=H/2+Math.sin(a)*250;n.vx=0;n.vy=0;});
    // sim — force-directed
    for(var it=0;it<460;it++){
      for(var a=0;a<nodes.length;a++)for(var b=a+1;b<nodes.length;b++){
        var na=nodes[a],nb=nodes[b],dx=na.x-nb.x,dy=na.y-nb.y,d2=dx*dx+dy*dy+0.01,d=Math.sqrt(d2);
        var f=11000/d2; var ux=dx/d,uy=dy/d;
        na.vx+=ux*f;na.vy+=uy*f;nb.vx-=ux*f;nb.vy-=uy*f;
      }
      edges.forEach(function(e){
        var dx=e[1].x-e[0].x,dy=e[1].y-e[0].y,d=Math.sqrt(dx*dx+dy*dy)+.01,f=(d-190)*0.009,ux=dx/d,uy=dy/d;
        e[0].vx+=ux*f;e[0].vy+=uy*f;e[1].vx-=ux*f;e[1].vy-=uy*f;
      });
      nodes.forEach(function(n){
        n.vx+=(W/2-n.x)*0.004;n.vy+=(H/2-n.y)*0.004;
        n.x+=Math.max(-16,Math.min(16,n.vx));n.y+=Math.max(-16,Math.min(16,n.vy));
        n.vx*=0.84;n.vy*=0.84;
      });
    }
    // fit viewbox to settled layout (accounts for label width to the right)
    var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    nodes.forEach(function(n){
      var lw=n.label.length*6.1+n.r+10;
      if(n.x-n.r<minX)minX=n.x-n.r; if(n.y-14<minY)minY=n.y-14;
      if(n.x+lw>maxX)maxX=n.x+lw; if(n.y+14>maxY)maxY=n.y+14;
    });
    var pad=36, vb0={x:minX-pad,y:minY-pad,w:(maxX-minX)+pad*2,h:(maxY-minY)+pad*2};
    var svg='<svg viewBox="'+vb0.x.toFixed(1)+' '+vb0.y.toFixed(1)+' '+vb0.w.toFixed(1)+' '+vb0.h.toFixed(1)+'" id="gsvg" preserveAspectRatio="xMidYMid meet">';
    var g='<g id="gg">';
    edges.forEach(function(e,i){g+='<line class="g-edge" data-a="'+e[0].id+'" data-b="'+e[1].id+'" x1="'+e[0].x.toFixed(1)+'" y1="'+e[0].y.toFixed(1)+'" x2="'+e[1].x.toFixed(1)+'" y2="'+e[1].y.toFixed(1)+'"/>';});
    nodes.forEach(function(n){
      var c=nodeColor(n.id);
      g+='<g class="g-node" data-id="'+n.id+'" transform="translate('+n.x.toFixed(1)+','+n.y.toFixed(1)+')">'+
         '<circle r="'+n.r.toFixed(1)+'" fill="'+c+'" fill-opacity="0.16" stroke="'+c+'" stroke-width="1.5"/>'+
         '<circle r="3" fill="'+c+'"/>'+
         '<text x="'+(n.r+6).toFixed(1)+'" y="4">'+n.label+'</text></g>';
    });
    g+='</g>';svg+=g+'</svg>';
    var legend=wrap.querySelector('.graph-legend'), hint=wrap.querySelector('.graph-hint');
    wrap.innerHTML=svg; if(hint)wrap.appendChild(hint); if(legend)wrap.appendChild(legend);
    wireGraph(wrap,nmap,vb0);
  }
  function wireGraph(wrap,nmap,vb0){
    var svg=wrap.querySelector('#gsvg'), gg=wrap.querySelector('#gg');
    var vb={x:vb0.x,y:vb0.y,w:vb0.w,h:vb0.h};
    function apply(){svg.setAttribute('viewBox',vb.x+' '+vb.y+' '+vb.w+' '+vb.h);}
    var pan=false,px,py;
    svg.addEventListener('mousedown',function(e){pan=true;px=e.clientX;py=e.clientY;});
    window.addEventListener('mouseup',function(){pan=false;});
    window.addEventListener('mousemove',function(e){
      if(!pan)return;var r=svg.getBoundingClientRect();
      vb.x-=(e.clientX-px)*(vb.w/r.width);vb.y-=(e.clientY-py)*(vb.h/r.height);px=e.clientX;py=e.clientY;apply();
    });
    svg.addEventListener('wheel',function(e){
      e.preventDefault();var s=e.deltaY>0?1.1:0.9;
      var r=svg.getBoundingClientRect();var mx=vb.x+(e.clientX-r.left)/r.width*vb.w,my=vb.y+(e.clientY-r.top)/r.height*vb.h;
      var ns=Math.max(220,Math.min(2400,vb.w*s))/vb.w;vb.w*=ns;vb.h*=ns;
      vb.x=mx-(e.clientX-r.left)/r.width*vb.w;vb.y=my-(e.clientY-r.top)/r.height*vb.h;apply();
    },{passive:false});
    [].slice.call(wrap.querySelectorAll('.g-node')).forEach(function(node){
      var id=node.dataset.id;
      node.addEventListener('mouseenter',function(){
        node.classList.add('hot');
        [].slice.call(wrap.querySelectorAll('.g-edge')).forEach(function(ed){
          if(ed.dataset.a===id||ed.dataset.b===id){ed.classList.add('hot');
            var other=ed.dataset.a===id?ed.dataset.b:ed.dataset.a;
            var on=wrap.querySelector('.g-node[data-id="'+other+'"]');if(on)on.classList.add('hot');
          }
        });
      });
      node.addEventListener('mouseleave',function(){
        [].slice.call(wrap.querySelectorAll('.hot')).forEach(function(x){x.classList.remove('hot');});
      });
      var moved=false;
      node.addEventListener('mousedown',function(){moved=false;});
      window.addEventListener('mousemove',function(){if(pan)moved=true;});
      node.addEventListener('click',function(){if(!moved){location.hash='#/system/'+id;}});
    });
  }

  /* ---------- UMSETZUNG + FRAGEN (data-driven) ---------- */
  function viewUmsetzung(){
    var R=window.ROADMAP||{};
    var h='';
    h+='<div class="crumb"><a href="#/">Übersicht</a><span class="crumb__sep">/</span>Umsetzung</div>';
    h+='<div class="eyebrow">Teil D</div><h1 class="title title--sm">Empfehlung zur Umsetzung</h1>';
    h+='<p class="lede">'+(R.lede||'')+'</p>';
    h+='<h2 class="sec" data-k="!" data-tone="war">Vier Entscheidungen, die vor allem anderen fallen müssen</h2>';
    h+='<div class="prose">'+ (R.decisions||[]).map(function(d,i){
      return '<div class="callout callout--war"><div class="callout__l">Entscheidung '+(i+1)+'</div><p><strong>'+d.t+'</strong> — '+d.d+'</p></div>';
    }).join('')+'</div>';
    h+='<h2 class="sec" data-k="S1">Vorgeschlagener Umfang</h2><div class="prose">'+proseBlocks(R.scope)+'</div>';
    if(R.phases){
      h+='<h2 class="sec" data-k="⌚" data-tone="peace">Kapitel-Fahrplan</h2><table class="tbl"><thead><tr><th>Phase</th><th>Inhalt</th></tr></thead><tbody>';
      h+=R.phases.map(function(p){return '<tr><td><b>'+p.t+'</b></td><td>'+p.d+'</td></tr>';}).join('');
      h+='</tbody></table>';
    }
    if(R.need){h+='<h2 class="sec" data-k="?">Was noch gebraucht wird</h2><div class="prose">'+proseBlocks(R.need)+'</div>';}
    return h;
  }
  function viewFragen(){
    var h='';
    h+='<div class="crumb"><a href="#/">Übersicht</a><span class="crumb__sep">/</span>Offene Fragen</div>';
    h+='<div class="eyebrow">Teil B.5 & D</div><h1 class="title title--sm">Offene Fragen</h1>';
    h+='<p class="lede">Bewusst nicht entschieden. Keine Balancing-Details, sondern Aussagen darüber, wofür der Server da ist und wen er schützt. Zu jeder Frage meine Empfehlung.</p>';
    h+=(window.QUESTIONS||[]).map(function(q){
      return '<div class="q"><div class="q__k">'+(q.block?'<span class="block">Blockierend</span>':'')+'Offene Frage</div>'+
        '<div class="q__t">'+q.t+'</div><div class="q__body">'+proseBlocks(q.body)+'</div>'+
        (q.rec?'<div class="q__rec"><span class="l">Meine Empfehlung</span><p>'+q.rec+'</p></div>':'')+'</div>';
    }).join('');
    return h;
  }

  /* ---------- ROUTER ---------- */
  function render(){
    var host=document.getElementById('view');
    var hash=location.hash||'#/';
    var m;
    var html, graph=false;
    if(hash==='#/'||hash===''){html=viewHome();}
    else if((m=hash.match(/^#\/system\/(.+)$/))){html=viewSystem(decodeURIComponent(m[1]));}
    else if((m=hash.match(/^#\/idee\/(.+)$/))){html=viewIdee(decodeURIComponent(m[1]));}
    else if(hash==='#/ideen'){html=viewIdeen();}
    else if(hash==='#/graph'){html=viewGraph();graph=true;}
    else if(hash==='#/umsetzung'){html=viewUmsetzung();}
    else if(hash==='#/fragen'){html=viewFragen();}
    else{html=viewHome();}
    host.innerHTML='<div class="view">'+html+'</div>';
    window.scrollTo(0,0);
    // wire clicks
    [].slice.call(host.querySelectorAll('[data-go]')).forEach(function(el){
      el.addEventListener('click',function(){location.hash=el.getAttribute('data-go');});
    });
    if(hash==='#/ideen'){
      var q=document.getElementById('q'); if(q)q.addEventListener('input',renderIdeaGrid);
      [].slice.call(document.querySelectorAll('#filter .toggle')).forEach(function(b){b.addEventListener('click',function(){b.classList.toggle('is-on');renderIdeaGrid();});});
      renderIdeaGrid();
    }
    if(graph){setTimeout(buildGraph,20);}
    buildNav();
    closeMobile();
  }

  function buildNav(){
    var nav=document.getElementById('nav'); if(!nav) return;
    var hash=location.hash||'#/';
    var h='';
    h+='<div class="nav__group"><div class="nav__item'+(hash==='#/'?' is-active':'')+'" data-go="#/"><span class="nav__num">◆</span>Übersicht</div>';
    h+='<div class="nav__item'+(hash==='#/graph'?' is-active':'')+'" data-go="#/graph"><span class="nav__num">◈</span>Lagekarte</div></div>';
    window.NAVGROUPS.forEach(function(gr){
      h+='<div class="nav__group"><div class="nav__label">'+gr.label+'</div>';
      gr.ids.forEach(function(id){
        var s=byId[id]; if(!s)return;
        var active=hash==='#/system/'+id;
        h+='<div class="nav__item'+(active?' is-active':'')+'" data-go="#/system/'+id+'"><span class="nav__num">'+(s.nrLabel||'')+'</span>'+s.title+'</div>';
      });
      h+='</div>';
    });
    h+='<div class="nav__group"><div class="nav__label">Katalog & Plan</div>';
    h+='<div class="nav__item'+(hash.indexOf('#/idee')===0?' is-active':'')+'" data-go="#/ideen"><span class="nav__num">50</span>Feature-Ideen</div>';
    h+='<div class="nav__item'+(hash==='#/umsetzung'?' is-active':'')+'" data-go="#/umsetzung"><span class="nav__num">▸</span>Umsetzung</div>';
    h+='<div class="nav__item'+(hash==='#/fragen'?' is-active':'')+'" data-go="#/fragen"><span class="nav__num">?</span>Offene Fragen</div></div>';
    nav.innerHTML=h;
    [].slice.call(nav.querySelectorAll('[data-go]')).forEach(function(el){el.addEventListener('click',function(){location.hash=el.getAttribute('data-go');});});
  }

  /* mobile */
  function openMobile(){document.getElementById('sidebar').classList.add('is-open');document.getElementById('scrim').classList.add('is-on');}
  function closeMobile(){document.getElementById('sidebar').classList.remove('is-open');document.getElementById('scrim').classList.remove('is-on');}

  window.addEventListener('hashchange',render);
  document.addEventListener('DOMContentLoaded',function(){
    index();
    var b=document.getElementById('burger'); if(b)b.addEventListener('click',openMobile);
    var sc=document.getElementById('scrim'); if(sc)sc.addEventListener('click',closeMobile);
    render();
  });
})();
</script>
